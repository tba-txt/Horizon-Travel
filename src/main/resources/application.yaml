spring:
  application:
    name: horizon-api
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 0
      idle-timeout: 120000
      max-lifetime: 240000
      connection-init-sql: "SET CLIENT_ENCODING TO 'UTF8';"
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

api:
  security:
    token:
      secret: ${JWT_SECRET}

cloudinary:
  cloud_name: ${CLOUDINARY_NAME}
  api_key: ${CLOUDINARY_KEY}
  api_secret: ${CLOUDINARY_SECRET}

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  show-actuator: false
  api-docs:
    path: /v3/api-docs

management:
  newrelic:
    metrics:
      export:
        enabled: ${NEW_RELIC_ENABLED:false}
  metrics:
    export:
      newrelic:
        enabled: ${NEW_RELIC_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}

open-meteo:
  forecast-url: ${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com}
  archive-url: ${OPEN_METEO_ARCHIVE_URL:https://archive-api.open-meteo.com}
  connect-timeout-ms: ${OPEN_METEO_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${OPEN_METEO_READ_TIMEOUT_MS:5000}
